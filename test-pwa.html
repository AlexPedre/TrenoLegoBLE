<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrenoLegoBLE - Diagnostica PWA</title><style>body{font:16px system-ui;margin:20px auto;padding:0 16px;max-width:850px;background:#eef4fb;color:#18304e}h1{font-size:1.45rem}.box{background:white;border-radius:12px;padding:16px;margin:16px 0;box-shadow:0 1px 5px #0001}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{border:0;background:#2196f3;color:white;padding:10px 16px;border-radius:8px;cursor:pointer}.ok{color:#087d3c}.bad{color:#ac1d1d}</style></head><body><h1>TrenoLegoBLE - Diagnostica PWA</h1><p>Questa pagina controlla che i file necessari siano effettivamente raggiungibili dal browser. Non modifica le impostazioni Bluetooth.</p><button id="run">Ripeti controlli</button><button id="copy">Copia rapporto</button><div class="box"><pre id="report">Avvio controlli...</pre></div><script>
let lines=[];const el=document.getElementById('report');function log(ok,msg){lines.push((ok?'OK: ':'ERRORE: ')+msg);el.textContent=lines.join('\n')}
async function check(url,kind){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const ty=r.headers.get('content-type')||'(assente)';if(kind==='json'){const j=await r.json();let errors=[];if(!j.name&&!j.short_name)errors.push('name mancante');if(!j.start_url)errors.push('start_url mancante');if(j.display!=='standalone'&&j.display!=='fullscreen'&&j.display!=='minimal-ui')errors.push('display non valido');for(const n of [192,512])if(!j.icons?.some(i=>i.sizes?.split(/\s+/).includes(n+'x'+n)))errors.push('icona '+n+' mancante');log(!errors.length, url+' - '+ty+(errors.length?' - '+errors.join(', '):''));return}if(kind==='img'){const blob=await r.blob();const bmp=await createImageBitmap(blob);const expected=url.includes('192')?192:512;log(bmp.width===expected&&bmp.height===expected,url+' - '+bmp.width+'x'+bmp.height+' - '+ty);bmp.close();return}log(true,url+' - '+ty)}catch(e){log(false,url+' - '+e.message)}}
async function run(){lines=[];log(window.isSecureContext,'Contesto sicuro: '+window.isSecureContext+' - '+location.href);log('serviceWorker' in navigator,'Service Worker API disponibile');log('bluetooth' in navigator,'Web Bluetooth disponibile');await check('./index.html');await check('./manifest.webmanifest','json');await check('./sw.js');for(const f of ['icon-192.png','icon-512.png','icon-maskable-512.png'])await check('./icons/'+f,'img');if('serviceWorker' in navigator){try{const r=await navigator.serviceWorker.getRegistration('./');log(!!r, 'Service Worker registrato: '+(r?.scope||'NESSUNO'));if(r)log(true,'Stato: '+(r.active?.state||r.waiting?.state||r.installing?.state||'non attivo'));}catch(e){log(false,'Stato Service Worker: '+e.message)}}log(true,'In Chrome Windows controlla anche F12 > Application > Manifest > Installability.');}
document.getElementById('run').onclick=run;document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(lines.join('\n'));run();</script></body></html>
